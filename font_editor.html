<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Bitmap font editor</title>
	<style>
		input[type=checkbox] {
			width: 40px;
			height: 20px;
		}
		td:has(input[type=checkbox]:checked) {
			background-color: blue;
		}
	</style>
</head>
<body>
	<table>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
		<tr>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
			<td><input type=checkbox></td>
		</tr>
	</table>
	<textarea id=bitmap></textarea>
	<script>
		const inputs = document.querySelectorAll('input');

		const update_bitmap = () => {
			const input_iter = inputs.values();

			let bitmap = "{ ";

			for (let i = 0; i < 4; ++i) {
				bitmap += "0b";

				for (let j = 0; j < 2; ++j) {
					bitmap += "0";
					bitmap += input_iter.next().value.checked ? "1" : "0";
					bitmap += input_iter.next().value.checked ? "1" : "0";
					bitmap += input_iter.next().value.checked ? "1" : "0";
				}

				bitmap += ", ";
			}

			bitmap += "},";

			document.getElementById('bitmap').textContent = bitmap;
		};

		for (input of inputs)
			input.addEventListener('change', update_bitmap);

		update_bitmap();
	</script>
</body>
</html>
